<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de ULE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    h1 {
      text-align: center;
    }

    form,
    label {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 2px;
      margin-bottom: .8rem;
    }

    form {
      margin-inline: auto;
      width: 24rem;
    }
  </style>
</head>

<body>
  <h1>Creación de una nueva jornada</h1>
  <form method="POST" action="/fests" enctype="multipart/form-data">
    <!-- <form> -->
    <label>Nombre:<input name="name" type="text"></label>
    <label>Objetivo: <textarea name="objective" id="objective"></textarea></label>
    <label>Descripción: <textarea name="description" id="description"></textarea></label>
    <label>
      Tipo de jornada
      <select name="fest_type" id="fest_type">
        <option value="workshop">Taller</option>
        <option value="event">Evento</option>
        <option value="competition">Competencia</option>
      </select>
    </label>
    <label>
      Con qué frecuencia será
      <select name="frequency" id="frequency">
        <option value="daily">Diario</option>
        <option value="weely">Semanal</option>
        <option value="monthly">Mensual</option>
        <option value="bimonthly">Bimensual</option>
      </select>
    </label>
    <label>Fecha de inicio: <input name="init_date" type="datetime-local"></label>
    <label>Fecha de finalización: <input name="end_date" type="datetime-local"></label>
    <label>Dirección de la jornada<input name="address" type="text"></label>
    <label>
      Subir una foto de, ns, alguna jornada
      <input name="img" accept="image/*" type="file">
    </label>
    <input type="submit" value="Subir nueva jornada">
  </form>
</body>

</html>
